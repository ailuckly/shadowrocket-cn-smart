# {{PROXY_RULES}}

# 5. 国内服务域名。未被更早规则命中的 .cn 在本段直连。
DOMAIN-SUFFIX,icbc.com.cn,DIRECT
DOMAIN-SUFFIX,vivo.com,DIRECT
# {{DIRECT_RULES}}

# 6. 已有目标 IP 按 CN 地理库直连；不额外解析未知域名来触发直连。
GEOIP,CN,DIRECT,no-resolve
FINAL,PROXY

[Host]
localhost = 127.0.0.1
# 国内 DoH 主机名直接对应地址，本机不必再为它们做一次查询。
dns.alidns.com = 223.5.5.5
doh.pub = 1.12.12.12
# 本地域名交给系统；它们是明确的本地 DNS 例外。
*.local = server:system
*.lan = server:system
*.home.arpa = server:system
