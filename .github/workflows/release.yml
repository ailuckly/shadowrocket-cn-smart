name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag matches config/sources.json version
        run: |
          want="v$(python3 -c 'import json;print(json.load(open("config/sources.json"))["version"])')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match sources.json version $want" >&2
            exit 1
          fi

      - name: Verify build and tests
        run: |
          python3 scripts/build.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp dist/*.conf release-assets/
          # 兼容旧版固定下载链接 Shadowrocket-CN-Smart.conf
          cp dist/Shadowrocket-CN-Smart-Offline.conf release-assets/Shadowrocket-CN-Smart.conf
          cp modules/*.module release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 优先使用 .github/releases/<tag>.md 作为发版说明，没有时由 GitHub 自动生成
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          title="Shadowrocket CN Smart ${GITHUB_REF_NAME}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            if [ -f "$notes" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "$title" "${notes_args[@]}"
          fi
