[Proxy Group]
# PROXY 为 Shadowrocket 内置策略（首页当前选中节点）。
# 所有服务组默认跟随 PROXY（哔哩哔哩默认 DIRECT），需要时可随时在 App 内对单个服务切换出口地区。
自动选择 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=^(?!.*(流量|套餐|到期|剩余|过期|官网|最新|重置)).*$
AI = select,PROXY,自动选择,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,policy-select-name=PROXY
# Gemini 专用可用组：自动排除香港及说明节点，保留美/日/新/台/韩，fallback 避免频繁切换出口 IP。
Gemini可用 = fallback,url=https://gemini.google.com/app,interval=600,timeout=5,policy-regex-filter=^(?!.*(香港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|hong|流量|套餐|到期|剩余|过期|官网|最新|重置)).*(美国|🇺🇸|日本|🇯🇵|新加坡|🇸🇬|台湾|🇹🇼|韩国|🇰🇷|(?<![A-Za-z])(USA?|JP|SG|TWN?|KR|KOR)(?![A-Za-z])|America|america|Japan|japan|Tokyo|tokyo|Sing|sing|Taiwan|Taipei|taiwan|Korea|korea).*$
Gemini = select,Gemini可用,PROXY,自动选择,policy-select-name=PROXY
